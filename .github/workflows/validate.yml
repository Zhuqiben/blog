name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check syntax
        run: node --check data.js && node --check main.js
      - name: Validate content
        run: node test/data.test.js
